# Builds the Windows installer and publishes a GitHub Release with the signed updater
# manifest (latest.json) that MeowViewer's built-in updater reads.
# Trigger: push a tag like v0.2.0  (git tag v0.2.0 && git push origin v0.2.0)
# Needs repo secrets: TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD if set).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error title=Missing secret::Add the repository secret TAURI_SIGNING_PRIVATE_KEY (contents of your updater private key) under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          # Section between "## <tag>" and the next "## " heading.
          notes=$(awk -v tag="## ${GITHUB_REF_NAME}" '$0==tag{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          [ -z "$notes" ] && notes="See CHANGELOG.md"
          {
            echo 'body<<NOTES_EOF'
            echo "$notes"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MeowViewer ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

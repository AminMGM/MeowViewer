[package]
name = "meowviewer"
version = "1.1.0"
description = "A fast, light photo & video viewer and gallery for Windows"
authors = ["AminMGM"]
license = "MIT"
repository = "https://github.com/AminMGM/MeowViewer"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "meowviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.7", features = [] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-dialog = "2.8.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
walkdir = "2.5.1"
kamadak-exif = "0.6.2"
imagesize = "0.15.0"
notify = "8.2.2"
clipboard-win = "5.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp", "tiff", "webp", "gif", "ico"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_UI_WindowsAndMessaging", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_FileSystem", "Win32_System_WinRT", "ApplicationModel_DataTransfer", "Storage", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_System_Time", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Media_Ocr", "Graphics_Imaging", "Globalization", "Win32_System_Registry", "Win32_System_Threading"] }
reqwest = { version = "0.13", default-features = false, features = ["multipart"] }
windows-collections = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
getrandom = "0.3"
base64 = "0.23.1"

# Decoders/encoders are hot paths: optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
